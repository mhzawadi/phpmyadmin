---

# docker stack deploy --compose-file stack-phpmyadmin.yml phpmyadmin

volumes:
  phpmyadmin_data:
  mariadb_10_4:

services:
  proxyv2:
    image: traefik:v3.6 # The official Traefik docker image
    command:
      - "--api.insecure=true"
      - "--providers.docker"
      - "--entrypoints.web.address=:80"
      - "--entryPoints.web.http.encodedCharacters.allowEncodedSlash=true"
      - "--entryPoints.web.http.encodedCharacters.allowEncodedQuestionMark=true"
      - "--entryPoints.web.http.encodedCharacters.allowEncodedPercent=true"
      - "--entryPoints.web.http.encodedCharacters.allowEncodedSemicolon=true"
      - "--entryPoints.web.http.encodedCharacters.allowEncodedHash=true"
    ports:
    ports:
      - "80:80"     # The HTTP port
      - "443:443"   # The HTTP port
      - "8181:8080" # The Web UI (enabled by --api)
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock # So that Traefik can listen to the Docker events
    labels:
      - "traefik.enable=false"
  phpmyadmin:
    image: mhzawadi/phpmyadmin
    volumes:
      - phpmyadmin_data:/mysql
    labels:
      - "traefik.http.routers.phpmyadmin.rule=Path(`/pma`)"
      - "traefik.http.routers.phpmyadmin.service=phpmyadmin"
      - "traefik.http.services.phpmyadmin.loadbalancer.server.port=80"
  mariadb_10_4:
    # MySQL 5.7
    image: mariadb:10.4.10
    volumes:
      - mariadb_10_4:/var/lib/mysql
    environment:
      - MYSQL_ROOT_PASSWORD=mysql_password
      - MYSQL_DATABASE=phpmyadmin
      - MYSQL_USER=phpmyadmin
      - MYSQL_PASSWORD=phpmyadmin
    labels:
      - "traefik.enable=false"
